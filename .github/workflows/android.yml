name: Build SwiftEasy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create --project-name swifteasy_android --platforms=android swifteasy_android

      - name: Get dependencies
        working-directory: swifteasy_android
        run: |
          flutter pub get

      - name: Build Release APK
        working-directory: swifteasy_android
        run: |
          flutter build apk --release

      - name: Upload SwiftEasy APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftEasy-Android-APK
          path: swifteasy_android/build/app/outputs/flutter-apk/app-release.apk
